name: Build release binaries

# Builds geneweb for amd64 and arm64 from an UPSTREAM geneweb tag, using
# upstream's own docker/Dockerfile (target: export), and attaches the
# tarballs to this repo's GitHub Release of the same tag name.
#
# Flow per upstream release:
#   1. bump GENEWEB default tag below / dispatch manually
#   2. assets land on the release
#   3. update manifest.toml urls + sha256

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream geneweb tag to build (e.g. v7.1.0-beta2)
        required: true
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream geneweb
        uses: actions/checkout@v4
        with:
          repository: geneweb/geneweb
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Build distribution via upstream Dockerfile
        run: docker build -f docker/Dockerfile --target export -o type=local,dest=distribution .

      - name: Pack
        run: tar czf "geneweb-${{ steps.tag.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" -C distribution .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --title "geneweb ${{ steps.tag.outputs.tag }}" --notes "Self-built binaries for the geneweb_ynh package, from upstream ${{ steps.tag.outputs.tag }}." || true
          gh release upload "${{ steps.tag.outputs.tag }}" "geneweb-${{ steps.tag.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
